name: offboarding-test

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       offboarding_test
      POSTGRES_USER:     offboarding
      POSTGRES_PASSWORD: offboarding
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data # banco descartável — cada "up" começa limpo
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offboarding -d offboarding_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
